<!doctype html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timeføring</title>
<meta name="theme-color" content="#1B6A87">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Timeføring">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#E9EFF1; --surface:#FFFFFF; --ink:#12303B; --ink2:#506E78; --line:#D3DEE2;
  --fjord:#1B6A87; --on-fjord:#FFFFFF; --fjord-soft:#DCEBF1;
  --sun:#E9A526; --sun-soft:#FBEBC8;
  --moss:#2F7050; --moss-soft:#DCEEE3;
  --brick:#A8392B; --brick-soft:#F5DCD7;
  --shadow:0 1px 0 rgba(18,48,59,.06), 0 12px 28px -20px rgba(18,48,59,.5);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1C22; --surface:#16272F; --ink:#E6F0F2; --ink2:#9AB3BB; --line:#26404A;
    --fjord:#5AB0CF; --on-fjord:#0E1C22; --fjord-soft:#1E3A46;
    --sun:#F2B33D; --sun-soft:#3A2F14;
    --moss:#7CC49A; --moss-soft:#1B3328;
    --brick:#EE8C7C; --brick-soft:#3A1F1B;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 28px -20px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.45 ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  padding-bottom:calc(86px + env(safe-area-inset-bottom));
}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--fjord); outline-offset:2px}
#app{max-width:760px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 16px}

/* header */
#hdr h1{margin:0;font-size:clamp(1.9rem,8vw,2.6rem);line-height:1.05;font-weight:700;letter-spacing:-.025em}
#hdr .sub{margin:4px 0 0;color:var(--ink2);font-size:1.02rem}
#hdr .hi{margin:0 0 2px;color:var(--fjord);font-weight:650;font-size:1rem}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:4px;justify-content:center;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.tabs button{flex:1;max-width:180px;border:0;background:transparent;padding:9px 6px;border-radius:12px;font-weight:600;color:var(--ink2);
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.82rem}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--fjord);background:var(--fjord-soft)}
@media (min-width:860px){
  body{padding-bottom:40px}
  .tabs{position:static;border:0;background:transparent;justify-content:flex-start;padding:14px 0 0}
  .tabs button{flex:none;flex-direction:row;gap:8px;padding:9px 14px;font-size:.98rem}
}

main{display:grid;gap:14px;margin-top:14px}
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
.card h3{margin:14px 0 6px;font-size:.95rem;font-weight:700}
.muted{color:var(--ink2)}
.small{font-size:.88rem}

/* ring */
.ringwrap{display:grid;place-items:center;padding:10px 0 2px}
.ringbtn{position:relative;width:min(76vw,290px);aspect-ratio:1;border:0;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);padding:0}
.ringbtn[data-act="none"]{cursor:default}
.ringbtn svg{position:absolute;inset:0;width:100%;height:100%}
.trk{fill:none;stroke:var(--fjord-soft);stroke-width:14}
.prg{fill:none;stroke:var(--fjord);stroke-width:14;stroke-linecap:round;transition:stroke-dasharray .6s ease}
.prg.over{stroke:var(--sun)}
.prg.away{stroke:var(--moss)}
.rin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;padding:0 17%}
.rin b{font-size:clamp(2rem,10vw,2.8rem);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1.05}
.rin b u{text-decoration:none;font-size:.42em;font-weight:600;color:var(--ink2);margin:0 .06em 0 .08em;letter-spacing:0}
.rin b u:not(:last-child){margin-right:.34em}
.rin small{color:var(--ink2);font-size:.92rem}
.rin em{font-style:normal;font-weight:650;font-size:.92rem;color:var(--fjord);margin-top:6px}
.rin em.ok{color:var(--moss)}
.ringbtn.running{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:var(--shadow),0 0 0 0 rgba(27,106,135,.28)}50%{box-shadow:var(--shadow),0 0 0 16px rgba(27,106,135,0)}}
@media (prefers-reduced-motion:reduce){.ringbtn.running{animation:none}.prg{transition:none}}
.mood{margin:12px 0 0;text-align:center;font-size:1.04rem;font-weight:550}

/* numbers */
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums.two{grid-template-columns:repeat(2,1fr)}
.nums.one{grid-template-columns:1fr}
.n{background:var(--bg);border-radius:14px;padding:10px 10px 9px;min-width:0}
.n i{display:block;font-style:normal;font-size:.8rem;color:var(--ink2);font-weight:600}
.n b{display:block;font-size:clamp(1.15rem,5.8vw,1.45rem);font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.15}
.n small{display:block;color:var(--ink2);font-size:.8rem;font-variant-numeric:tabular-nums}
.n.main{background:var(--fjord-soft)}
.n.pos b{color:var(--moss)}
.n.sunny{background:var(--sun-soft)}

/* editor */
.editor{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:grid;gap:4px;min-width:0}
.fld>span{font-size:.84rem;font-weight:650;color:var(--ink2)}
.inp{display:flex;gap:6px}
input[type=text],input[type=number],select,textarea{width:100%;min-width:0;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
input.time{font-size:1.25rem;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:.02em}
textarea{resize:vertical;min-height:44px}
.mini{border:0;background:var(--fjord-soft);color:var(--fjord);font-weight:700;border-radius:10px;padding:0 12px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-weight:600;font-size:.92rem;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--fjord);border-color:var(--fjord);color:var(--on-fjord)}
.chip.static{cursor:default;padding:3px 10px;font-size:.8rem}
.chip.static.hol{background:var(--sun-soft);border-color:transparent;color:var(--ink)}
.chip.static.warn{background:var(--brick-soft);border-color:transparent;color:var(--brick)}
.chip.static.ok{background:var(--moss-soft);border-color:transparent;color:var(--moss)}
.chip.static.info{background:var(--fjord-soft);border-color:transparent;color:var(--fjord)}
.sw{display:flex;align-items:center;gap:10px;padding:6px 0;font-weight:600}
.sw input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked{background:var(--fjord)}
.sw input:checked::after{transform:translateX(18px)}
.sw span small{display:block;font-weight:500;color:var(--ink2)}
.lunchtxt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lunchtxt code{background:var(--bg);padding:6px 10px;border-radius:8px;font-size:.95rem}
.note{margin:0;padding:10px 12px;border-radius:12px;background:var(--fjord-soft);font-size:.95rem}
.note.warn{background:var(--brick-soft);color:var(--ink)}
.note button{margin-left:8px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--fjord);color:var(--on-fjord)}
.btn.ghost{background:var(--fjord-soft);color:var(--fjord)}
.btn.danger{background:var(--brick-soft);color:var(--brick)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}

/* week */
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav h2{margin:0;font-size:1.15rem;text-align:center;flex:1}
.nav h2 small{display:block;font-weight:500;color:var(--ink2);font-size:.85rem}
.nav button{border:0;background:var(--fjord-soft);color:var(--fjord);width:44px;height:44px;border-radius:50%;font-size:1.3rem;font-weight:700}
.days{display:grid;gap:8px}
.drow{display:grid;gap:8px;width:100%;text-align:left;border:0;background:var(--surface);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow)}
.drow.off{background:transparent;box-shadow:none;border:1.5px dashed var(--line)}
.drow .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.drow .top b{font-size:1.05rem}
.drow .top small{color:var(--ink2);margin-left:6px;font-size:.88rem}
.drow .tm{font-variant-numeric:tabular-nums;font-weight:650}
.drow .cc{display:flex;gap:5px;flex-wrap:wrap}
.drow .nums .n{padding:7px 9px}
.drow .nums .n b{font-size:1.15rem}
@media (min-width:640px){
  .drow{grid-template-columns:150px 1fr;align-items:center}
  .drow .cc{grid-column:1/-1}
  .drow .top{display:grid;gap:2px}
  .drow .top small{margin-left:0}
}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:62px 1fr 96px;gap:8px;align-items:center;font-size:.9rem}
.bar .tr{height:14px;border-radius:999px;background:var(--bg);position:relative;overflow:hidden}
.bar .tr span{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--fjord)}
.bar .tr span.over{background:var(--sun)}
.bar .tr::after{content:"";position:absolute;top:0;bottom:0;left:76.9%;width:2px;background:var(--ink2);opacity:.45}
.bar>span:first-child{white-space:nowrap}
.bar .v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink2)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:0}
.kv dt{color:var(--ink2)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.grid2{display:grid;gap:12px}
@media (min-width:640px){.grid2.c2{grid-template-columns:1fr 1fr}}
.setgrid{display:grid;gap:12px}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,25,31,.55);z-index:30}
.sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--surface);
  border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;box-shadow:0 -20px 40px -20px rgba(0,0,0,.4)}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.sheet header h2{margin:0;font-size:1.2rem}
.sheet header button{border:0;background:var(--bg);width:40px;height:40px;border-radius:50%;font-size:1.1rem}
.sheet .nums{margin-bottom:12px}
@media (min-width:860px){.sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:24px}}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);
  width:max-content;padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header id="hdr"></header>
  <nav class="tabs" id="tabs" aria-label="Hovudmeny"></nav>
  <main id="main"></main>
</div>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script id="core">
/* ================= KJERNE: rekning (ingen DOM) ================= */
const pad2 = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const fromISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dowMon1 = d => (d.getDay() + 6) % 7 + 1;            // man=1 ... søn=7
const mondayOf = d => addDays(d, -(dowMon1(d) - 1));
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return { week: Math.ceil(((t - y0) / 86400000 + 1) / 7), year: t.getUTCFullYear() };
}
function easter(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
    f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
    i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7,
    m = Math.floor((a + 11 * h + 22 * l) / 451), mo = Math.floor((h + l - 7 * m + 114) / 31),
    da = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mo - 1, da);
}
const _hol = {};
function holidays(y) {
  if (_hol[y]) return _hol[y];
  const e = easter(y), m = {}, add = (d, k) => { m[iso(d)] = k; };
  add(new Date(y, 0, 1), 'h.newyear'); add(addDays(e, -3), 'h.maundy'); add(addDays(e, -2), 'h.good');
  add(e, 'h.easter1'); add(addDays(e, 1), 'h.easter2'); add(new Date(y, 4, 1), 'h.may1');
  add(new Date(y, 4, 17), 'h.may17'); add(addDays(e, 39), 'h.asc'); add(addDays(e, 49), 'h.pent1');
  add(addDays(e, 50), 'h.pent2'); add(new Date(y, 11, 25), 'h.xmas1'); add(new Date(y, 11, 26), 'h.xmas2');
  return (_hol[y] = m);
}
const holidayKey = ds => holidays(+ds.slice(0, 4))[ds];

// Tidspunkt: godtek 815, 0815, 8:15, 8.15, 8 → "HH:MM". '' = tomt, null = ugyldig.
function parseTime(raw) {
  const s = String(raw == null ? '' : raw).trim().replace(/\s+/g, '');
  if (!s) return '';
  let h, m, r;
  if ((r = s.match(/^(\d{1,2})[:.,](\d{2})$/))) { h = +r[1]; m = +r[2]; }
  else if ((r = s.match(/^(\d{1,2})$/))) { h = +r[1]; m = 0; }
  else if ((r = s.match(/^(\d{1,2})(\d{2})$/))) { h = +r[1]; m = +r[2]; }
  else return null;
  if (h > 23 || m > 59) return null;
  return pad2(h) + ':' + pad2(m);
}
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const nowHM = () => { const n = new Date(); return pad2(n.getHours()) + ':' + pad2(n.getMinutes()); };
const r2 = x => Math.round((x + 1e-9) * 100) / 100;
const fd = x => x.toFixed(2).replace('.', ',');
const fm = min => {
  const neg = min < 0, a = Math.abs(Math.round(min));
  return (neg ? '−' : '') + Math.floor(a / 60) + ' t ' + pad2(a % 60) + ' min';
};
const sgm = min => (min > 0 ? '+' : '') + fm(min);
const sgd = x => (x > 0 ? '+' : x < 0 ? '−' : '') + fd(Math.abs(x));

const WORK = ['work', 'home'];
const ABSENT = ['sick', 'vacation', 'leave'];
const TYPES = ['work', 'home', 'sick', 'vacation', 'flexoff', 'leave'];
const isWork = t => WORK.includes(t || 'work');

// Rekn ut éin dag. S = innstillingar (norm i timar, lunch i minutt).
function calc(ds, d, S) {
  const dt = fromISO(ds), dow = dowMon1(dt), hol = holidayKey(ds);
  const norm = (dow <= 5 && !hol) ? Math.round(S.norm * 60) : 0;
  const r = { ds, dow, hol, norm, type: (d && d.type) || 'work', gross: 0, net: 0, ot: 0, flex: 0, abs: 0,
    open: false, bad: false, st: 0, nt: 0, dbl: 0, counted: false };
  if (!d) return r;
  const t = r.type;
  if (isWork(t)) {
    if (d.in && d.out) {
      const g = toMin(d.out) - toMin(d.in);
      if (g <= 0) { r.bad = true; return r; }
      const n = Math.max(0, g - (d.lunch ? S.lunch : 0));
      r.gross = g; r.net = n; r.counted = true;
      if (d.ot) { r.ot = Math.max(0, n - norm); r.flex = Math.min(0, n - norm); }
      else r.flex = n - norm;
      r.st = r2(g / 60); r.nt = r2(n / 60); r.dbl = r2(r.st + r.nt);
    } else if (d.in) r.open = true;
  } else if (t === 'flexoff') { r.flex = -norm; r.counted = true; }
  else { r.abs = norm; r.counted = true; }
  return r;
}
function sumDays(list) {
  const s = { gross: 0, net: 0, ot: 0, flex: 0, abs: 0, st: 0, nt: 0, dbl: 0, norm: 0, days: 0 };
  for (const r of list) {
    s.gross += r.gross; s.net += r.net; s.ot += r.ot; s.flex += r.flex; s.abs += r.abs;
    s.st += r.st; s.nt += r.nt; s.dbl += r.dbl; s.norm += r.norm; if (r.gross > 0) s.days++;
  }
  s.st = r2(s.st); s.nt = r2(s.nt); s.dbl = r2(s.dbl);
  return s;
}
function flexBalance(days, S) {            // minutt
  let sum = Math.round((S.flexStart || 0) * 60);
  for (const ds in days) sum += calc(ds, days[ds], S).flex;
  return sum;
}
</script>

const WD = { nn: ['Måndag','Tysdag','Onsdag','Torsdag','Fredag','Laurdag','Søndag'], nb: ['Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag','Søndag'] };
const WDS = { nn: ['Man','Tys','Ons','Tor','Fre','Lau','Søn'], nb: ['Man','Tir','Ons','Tor','Fre','Lør','Søn'] };
const MON = ['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
const MONS = ['jan','feb','mars','apr','mai','juni','juli','aug','sep','okt','nov','des'];

/* ================= LAGRING ================= */
const KEY = 'timeforing.v1';
const defaults = () => ({ v: 1, settings: { norm: 7.5, lunch: 20, lunchDefault: true, lunchStart: '11:00', flexStart: 0,
  showST: true, lang: 'nn', name: '', vac: {} }, days: {} });
function normalizeDB(o) {
  const base = defaults();
  if (!o || typeof o !== 'object') return base;
  base.settings = Object.assign(base.settings, o.settings || {});
  if (!base.settings.vac || typeof base.settings.vac !== 'object') base.settings.vac = {};
  base.days = (o.days && typeof o.days === 'object') ? o.days : {};
  return base;
}
function loadDB() { try { const raw = localStorage.getItem(KEY); if (raw) return normalizeDB(JSON.parse(raw)); } catch (e) {} return defaults(); }
let _persisted = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { toast('Klarte ikkje lagre – er lagringa full?'); }
  if (!_persisted && navigator.storage && navigator.storage.persist) { _persisted = true; navigator.storage.persist().catch(() => {}); }
}
let DB = loadDB();
const S = () => DB.settings;
const L = () => (S().lang === 'nb' ? 'nb' : 'nn');
function t(k, p) {
  let s = (T[L()] && T[L()][k]) ?? T.nn[k] ?? k;
  if (p) for (const q in p) s = s.split('{' + q + '}').join(p[q]);
  return s;
}

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const todayISO = () => iso(new Date());
const wdName = ds => WD[L()][dowMon1(fromISO(ds)) - 1];
const wdShort = ds => WDS[L()][dowMon1(fromISO(ds)) - 1];
const dShort = ds => { const d = fromISO(ds); return d.getDate() + '. ' + MONS[d.getMonth()]; };
const dLong = ds => { const d = fromISO(ds); return d.getDate() + '. ' + MON[d.getMonth()]; };
const num = v => { const x = parseFloat(String(v).replace(',', '.')); return isNaN(x) ? null : x; };
const bigHM = min => { const a = Math.max(0, Math.round(min)); return `${Math.floor(a / 60)}<u>t</u>${pad2(a % 60)}<u>min</u>`; };
let _tt;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('show'), 2600); }
async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (_) {} ta.remove(); }
  toast(t('copied'));
}
async function saveFile(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  try {
    const f = new File([blob], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast(t('exported'));
}

function setDay(ds, patch) {
  let d = DB.days[ds];
  if (!d) d = { type: 'work', lunch: S().lunchDefault };
  d = Object.assign({}, d, patch);
  for (const k of Object.keys(d)) if (d[k] === '' || d[k] === undefined || d[k] === null) delete d[k];
  if (!d.in && !d.out && !d.note && (!d.type || d.type === 'work') && !d.ot) delete DB.days[ds]; else DB.days[ds] = d;
  save(); render();
}
function weekData(mondayStr) {
  const m = fromISO(mondayStr), days = [];
  for (let i = 0; i < 7; i++) { const ds = iso(addDays(m, i)); days.push(calc(ds, DB.days[ds], S())); }
  return { days, sum: sumDays(days) };
}
const vacOf = y => Object.assign({ rett: 25, over: 0, out: 0 }, S().vac[y] || {});
function vacUsed(y) {
  let n = 0;
  for (const ds in DB.days) if (ds.startsWith(y + '-') && DB.days[ds].type === 'vacation' && calc(ds, DB.days[ds], S()).norm > 0) n++;
  return n;
}

function numsHTML(r, cls) {
  const st = S().showST;

  const cells = [];
  if (st) cells.push(`<div class="n"><i>${t('st')}</i><b>${fd(r.st)}</b><small>${fm(g)}</small></div>`);
  cells.push(`<div class="n main"><i>${t('net')}</i><b>${fd(r.nt)}</b><small>${fm(n)}</small></div>`);
  if (st) cells.push(`<div class="n"><i>${t('dbl')}</i><b>${fd(r.dbl)}</b><small>${fm(g + n)}</small></div>`);
  return `<div class="nums ${st ? '' : 'one'} ${cls || ''}">${cells.join('')}</div>`;
}
function sumNumsHTML(s) { return numsHTML({ st: s.st, nt: s.nt, dbl: s.dbl, gross: s.gross, net: s.net }); }

function editor(ds) {
  const s = S(), raw = DB.days[ds], d = raw || {}, r = calc(ds, raw, s);
  const type = d.type || 'work', work = isWork(type);
  const lunchOn = d.lunch !== undefined ? !!d.lunch : s.lunchDefault;
  const lstart = d.lunchStart || s.lunchStart;
  const lend = pad2(Math.floor(((toMin(lstart) + s.lunch) % 1440) / 60)) + ':' + pad2((toMin(lstart) + s.lunch) % 60);
  const lunchTxt = `Lønsj ${lstart}-${lend}`;
  return `<div class="editor" data-date="${ds}">
  <div class="chips" role="group" aria-label="${t('dayType')}">
    ${TYPES.map(k => `<button type="button" class="chip" data-act="type" data-v="${k}" aria-pressed="${type === k}">${t('type.' + k)}</button>`).join('')}
  </div>
  ${work ? `
  <div class="two">
    <label class="fld"><span>${t('in')}</span><div class="inp"><input class="time" type="text" inputmode="numeric" autocomplete="off" data-f="in" placeholder="${t('tm.ph')}" value="${d.in || ''}"><button type="button" class="mini" data-act="now" data-f="in">${t('now')}</button></div></label>
    <label class="fld"><span>${t('out')}</span><div class="inp"><input class="time" type="text" inputmode="numeric" autocomplete="off" data-f="out" placeholder="${t('tm.ph')}" value="${d.out || ''}"><button type="button" class="mini" data-act="now" data-f="out">${t('now')}</button></div></label>
  </div>
  ${r.bad ? `<p class="note warn">${t('bad')}</p>` : ''}
  <label class="sw"><input type="checkbox" data-f="lunch" ${lunchOn ? 'checked' : ''}><span>${t('lunch')} (${s.lunch} min)<small>${t('lunch.sub')}</small></span></label>
  ${lunchOn ? `<div class="lunchtxt"><label class="fld" style="width:130px"><span>${t('lunchFrom')}</span><input class="time" type="text" inputmode="numeric" autocomplete="off" data-f="lunchStart" value="${lstart}"></label>
     <code>${lunchTxt}</code><button type="button" class="mini" data-act="copy" data-text="${esc(lunchTxt)}">${t('copy')}</button></div>` : ''}
  <label class="sw"><input type="checkbox" data-f="ot" ${d.ot ? 'checked' : ''}><span>${t('overtime')}<small>${t('overtime.sub')}</small></span></label>` : ''}
  <label class="fld"><span>${t('note')}</span><input type="text" data-f="note" placeholder="${esc(t('note.ph'))}" value="${esc(d.note || '')}"></label>
  </div>`;
}

function viewToday() {
  const s = S(), ds = todayISO(), d = DB.days[ds] || null, r = calc(ds, d, s);
  const wk = weekData(iso(mondayOf(new Date())));
  const type = r.type;
  let state = 'idle';
  if (d && isWork(type)) state = d.in ? (d.out ? 'done' : 'running') : 'idle';
  else if (d) state = 'away';
  let live = 0;
  if (state === 'running') {
    const nm = toMin(nowHM()), g = Math.max(0, nm - toMin(d.in));
    const lunchOver = d.lunch && nm >= toMin(d.lunchStart || s.lunchStart) + s.lunch;
    live = Math.max(0, g - (lunchOver ? s.lunch : 0));
  }
  const freeDay = r.norm === 0;
  let pct = 0, cls = '', inner = '', btnCls = '', act = 'ring', label = t('checkin');
  if (state === 'idle') {
    inner = `<small>${freeDay ? (r.hol ? esc(t(r.hol)) : wdName(ds)) : t('ring.notin')}</small><b>${nowHM()}</b><em>${freeDay ? t('ring.freeq') : t('ring.tapin')}</em>`;
  } else if (state === 'running') {
    pct = r.norm ? live / r.norm : 0; cls = pct >= 1 ? 'over' : ''; btnCls = 'running'; label = t('checkout');
    inner = `<small>${t('ring.since', { t: d.in })}</small><b>${bigHM(live)}</b><em>${t('ring.tapout')}</em>`;
  } else if (state === 'done') {
    act = 'none'; label = t('ring.done');
    if (r.bad) { inner = `<small>${d.in} – ${d.out}</small><b>?</b><em>${t('ring.check')}</em>`; }
    else { pct = r.norm ? r.net / r.norm : 1; cls = (r.norm && pct >= 1) ? 'over' : ''; inner = `<small>${d.in} – ${d.out}</small><b>${bigHM(r.net)}</b><em class="ok">${t('ring.done')}</em>`; }
  } else {
    act = 'none'; pct = 1; cls = 'away'; label = t('type.' + type);
    inner = `<small>${esc(t('type.' + type))}</small><b>${fd(r.norm / 60)}<u>t</u></b><em class="ok">${wdName(ds)}</em>`;
  }
  const R = 94, C = 2 * Math.PI * R, p = Math.min(1, pct);
  const ringSvg = `<svg viewBox="0 0 220 220" aria-hidden="true"><circle class="trk" cx="110" cy="110" r="${R}"/><circle class="prg ${cls}" cx="110" cy="110" r="${R}" stroke-dasharray="${(C * p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 110 110)"/></svg>`;

  // stemning
  let mood;
  if (state === 'away') mood = '🌿 ' + t('mood.' + type);
  else if (state === 'done') mood = r.net > 9 * 60 ? '🌙 ' + t('mood.long') : r.dow === 5 ? '🎉 ' + t('mood.done.fri') : '🌿 ' + t(r.net >= r.norm ? 'mood.done' : 'mood.done.short');
  else if (state === 'running') mood = live >= r.norm && r.norm ? '☀️ ' + t('mood.norm') : '🙂 ' + t('mood.going');
  else if (r.hol) mood = '🎈 ' + t('mood.holiday', { h: t(r.hol) });
  else if (r.dow > 5) mood = '🛋️ ' + t('mood.weekend');
  else mood = r.dow === 1 ? '☕ ' + t('mood.start.mon') : r.dow === 5 ? '🌤️ ' + t('mood.start.fri') : '☕ ' + t('mood.start');

  // manglande utsjekk
  let banner = '';
  const past = Object.keys(DB.days).filter(k => k < ds && isWork(DB.days[k].type) && DB.days[k].in && !DB.days[k].out).sort().pop();
  if (past) banner = `<p class="note warn">${t('missing', { d: wdShort(past) + ' ' + dShort(past) })}<button class="btn ghost" data-act="edit" data-date="${past}">${t('fix')}</button></p>`;

  const numbers = (state === 'done' && !r.bad) ? numsHTML(r) : '';
  const flexNote = (state === 'done' && !r.bad) ? `<div class="row small muted" style="margin-top:8px"><span>${t('flex')}: <b>${sgm(r.flex)}</b></span>${r.ot ? `<span>${t('ot')}: <b>${fm(r.ot)}</b></span>` : ''}</div>` : '';

  const wsum = wk.sum;
  const wkCard = `<div class="card"><div class="row between"><b>${t('weekLbl', { w: isoWeek(new Date()).week })}</b><span class="muted small">${t('worked')} ${fm(wsum.net)} / ${fm(wsum.norm)}</span></div>
    <div class="bar" style="grid-template-columns:1fr 92px;margin-top:8px"><div class="tr"><span class="${wsum.net > wsum.norm ? 'over' : ''}" style="width:${Math.min(130, wsum.norm ? wsum.net / wsum.norm * 76.9 : 0).toFixed(1)}%"></span></div><span class="v">${t('flex')} ${sgm(wsum.flex)}</span></div></div>`;

  return `${banner}
  <section class="card"><div class="ringwrap"><button class="ringbtn ${btnCls}" data-act="${act}" aria-label="${esc(label)}">${ringSvg}<span class="rin">${inner}</span></button></div>
    <p class="mood">${mood}</p>
    ${state === 'done' ? `<div class="row" style="justify-content:center;margin-top:10px"><button class="btn ghost" data-act="reopen">${t('reopen')}</button></div>` : ''}
  </section>
  ${numbers ? `<section class="card">${numbers}${flexNote}</section>` : ''}
  ${wkCard}
  <section class="card"><h2>${t('dayYou')}</h2>${editor(ds)}</section>`;
}

function dayRow(r) {
  const d = DB.days[r.ds], today = todayISO();
  const chips = [];
  if (r.hol) chips.push(`<span class="chip static hol">${esc(t(r.hol))}</span>`);
  if (d && !isWork(r.type)) chips.push(`<span class="chip static ok">${t('type.' + r.type)}</span>`);
  if (d && r.type === 'home') chips.push(`<span class="chip static info">${t('type.home')}</span>`);
  if (d && d.ot) chips.push(`<span class="chip static info">${t('overtime')}${r.ot ? ' ' + fm(r.ot) : ''}</span>`);
  if (d && isWork(r.type) && d.in && d.out && !d.lunch) chips.push(`<span class="chip static">${t('nolunch')}</span>`);
  if (r.open) chips.push(`<span class="chip static ${r.ds < today ? 'warn' : 'info'}">${r.ds < today ? t('missingChip') : t('running')}</span>`);
  if (r.bad) chips.push(`<span class="chip static warn">${t('ring.check')}</span>`);
  if (d && d.note) chips.push(`<span class="chip static">${esc(d.note)}</span>`);
  const times = (d && isWork(r.type) && d.in) ? `${d.in} – ${d.out || '…'}` : '–';
  const hasNums = r.gross > 0;
  const off = !d && r.norm === 0;
  return `<button class="drow ${off ? 'off' : ''}" data-act="edit" data-date="${r.ds}">
    <div class="top"><span><b>${wdName(r.ds)}</b><small>${dShort(r.ds)}</small></span><span class="tm">${times}</span></div>
    ${hasNums ? numsHTML(r) : ''}
    ${chips.length ? `<div class="cc">${chips.join('')}</div>` : ''}</button>`;
}

function viewWeek() {
  const m = fromISO(ui.week), wk = isoWeek(m), data = weekData(ui.week), sum = data.sum;
  const rows = data.days.filter((r, i) => i < 5 || ui.weekend || DB.days[r.ds]);
  const last = iso(addDays(m, 6));
  const isCur = ui.week === iso(mondayOf(new Date()));
  return `<div class="nav"><button data-act="wk" data-n="-1" aria-label="‹">‹</button>
    <h2>${t('weekLbl', { w: wk.week })}<small>${dShort(ui.week)} – ${dShort(last)} ${m.getFullYear()}</small></h2>
    <button data-act="wk" data-n="1" aria-label="›">›</button></div>
  <div class="days">${rows.map(dayRow).join('')}</div>
  <section class="card"><h2>${t('sum')}</h2>${sumNumsHTML(sum)}
    <dl class="kv" style="margin-top:12px">
      <dt>${t('norm')}</dt><dd>${fm(sum.norm)}</dd>
      ${sum.abs ? `<dt>${t('type.vacation')} / ${t('type.sick')}</dt><dd>${fm(sum.abs)}</dd>` : ''}
      <dt>${t('flex')}</dt><dd>${sgm(sum.flex)}</dd>
      <dt>${t('ot')}</dt><dd>${fm(sum.ot)}</dd>
    </dl></section>
  <section class="card"><div class="row">
    ${isCur ? '' : `<button class="btn ghost" data-act="wk-today">${t('week.today')}</button>`}
    <button class="btn ghost" data-act="copyweek">${t('week.copy')}</button>
    <button class="btn ghost" data-act="weekend">${t('week.weekend')}</button>
    <select data-act="weekfill" aria-label="${t('week.fill')}" style="width:auto"><option value="">${t('week.fill')}</option>
      ${['vacation', 'sick', 'flexoff', 'leave'].map(k => `<option value="${k}">${t('type.' + k)}</option>`).join('')}</select>
  </div></section>`;
}

function viewOverview() {
  const [y, mo] = ui.month.split('-').map(Number);
  const first = new Date(y, mo - 1, 1), n = new Date(y, mo, 0).getDate();
  const list = [], byWeek = {};
  for (let i = 1; i <= n; i++) {
    const ds = iso(new Date(y, mo - 1, i)), r = calc(ds, DB.days[ds], S()); list.push(r);
    const wk = isoWeek(fromISO(ds)).week; (byWeek[wk] = byWeek[wk] || []).push(r);
  }
  const sum = sumDays(list);
  const bars = Object.keys(byWeek).map(w => {
    const ws = sumDays(byWeek[w]), pct = ws.norm ? ws.net / ws.norm : 0;
    return `<div class="bar"><span>${t('nav.week')} ${w}</span><div class="tr"><span class="${pct > 1 ? 'over' : ''}" style="width:${Math.min(130, pct * 76.9).toFixed(1)}%"></span></div><span class="v">${fm(ws.net)}</span></div>`;
  }).join('');
  const bal = flexBalance(DB.days, S());
  const yr = y;
  let ot = 0, sick = 0;
  for (const ds in DB.days) if (ds.startsWith(yr + '-')) { const r = calc(ds, DB.days[ds], S()); ot += r.ot; if (r.type === 'sick' && r.norm > 0) sick++; }
  const v = vacOf(yr), used = vacUsed(yr), left = v.rett + v.over - used - v.out;
  return `<div class="nav"><button data-act="mo" data-n="-1" aria-label="‹">‹</button>
    <h2>${MON[mo - 1][0].toUpperCase() + MON[mo - 1].slice(1)} ${y}</h2><button data-act="mo" data-n="1" aria-label="›">›</button></div>
  <section class="card"><h2>${t('ov.month')}</h2>${sumNumsHTML(sum)}
    <dl class="kv" style="margin-top:12px"><dt>${t('ov.days')}</dt><dd>${sum.days}</dd><dt>${t('ov.flexMonth')}</dt><dd>${sgm(sum.flex)}</dd><dt>${t('ot')}</dt><dd>${fm(sum.ot)}</dd></dl></section>
  <section class="card"><h2>${t('ov.weeks')}</h2><div class="bars">${bars}</div></section>
  <section class="card"><h2>${t('ov.flex')}</h2>
    <div class="nums two"><div class="n ${bal > 0 ? 'pos sunny' : 'main'}"><i>${t('ov.flex.sub')}</i><b>${sgd(r2(bal / 60))}</b><small>${sgm(bal)}</small></div>
    <div class="n"><i>${t('ov.ot')} ${yr}</i><b>${fd(r2(ot / 60))}</b><small>${fm(ot)}</small></div></div>
    <dl class="kv" style="margin-top:12px"><dt>${t('ov.sick')} ${yr}</dt><dd>${sick}</dd><dt>${t('ov.vac')} ${yr}</dt><dd>${left} / ${v.rett + v.over}</dd></dl>
    <p class="small muted" style="margin:10px 0 0">${t('set.flexStart')}: ${sgd(S().flexStart)}</p>
    <div class="row" style="margin-top:8px"><button class="btn ghost" data-act="tab" data-v="settings">${t('nav.settings')}</button></div></section>`;
}

function fldNum(label, key, val, sub) {
  return `<label class="fld"><span>${label}</span><input type="text" inputmode="decimal" data-s="${key}" value="${String(val).replace('.', ',')}">${sub ? `<span class="small muted" style="font-weight:500">${sub}</span>` : ''}</label>`;
}
function viewSettings() {
  const s = S(), y = ui.vacYear, v = vacOf(y), used = vacUsed(y), left = v.rett + v.over - used - v.out;
  return `<section class="card"><h2>${t('set.profile')}</h2><div class="setgrid">
    <label class="fld"><span>${t('set.name')}</span><input type="text" data-s="name" value="${esc(s.name)}" autocomplete="off"></label>
    <label class="fld"><span>${t('set.lang')}</span><select data-s="lang"><option value="nn" ${s.lang === 'nn' ? 'selected' : ''}>Nynorsk</option><option value="nb" ${s.lang === 'nb' ? 'selected' : ''}>Bokmål</option></select></label>
    <label class="sw"><input type="checkbox" data-s="showST" ${s.showST ? 'checked' : ''}><span>${t('set.showST')}</span></label></div></section>
  <section class="card"><h2>${t('set.rules')}</h2><div class="setgrid">
    <div class="two">${fldNum(t('set.norm'), 'norm', s.norm)}${fldNum(t('set.lunchMin'), 'lunch', s.lunch)}</div>
    <label class="sw"><input type="checkbox" data-s="lunchDefault" ${s.lunchDefault ? 'checked' : ''}><span>${t('set.lunchDef')}</span></label>
    <label class="fld" style="max-width:180px"><span>${t('set.lunchStart')}</span><input class="time" type="text" inputmode="numeric" data-s="lunchStart" value="${s.lunchStart}"></label>
    ${fldNum(t('set.flexStart'), 'flexStart', s.flexStart, t('set.flexStart.sub'))}</div></section>
  <section class="card"><div class="nav"><button data-act="vac" data-n="-1" aria-label="‹">‹</button><h2 style="margin:0">${t('set.vac')} ${y}</h2><button data-act="vac" data-n="1" aria-label="›">›</button></div>
    <div class="setgrid" style="margin-top:12px"><div class="two">${fldNum(t('set.vacRett'), 'vacRett', v.rett)}${fldNum(t('set.vacOver'), 'vacOver', v.over)}</div>
    ${fldNum(t('set.vacOut'), 'vacOut', v.out)}
    <dl class="kv"><dt>${t('set.vacUsed')}</dt><dd>${used}</dd><dt>${t('set.vacLeft')}</dt><dd>${left}</dd></dl></div></section>
  <section class="card"><h2>${t('set.backup')}</h2><p class="small muted" style="margin-top:0">${t('set.backup.sub')}</p>
    <div class="row"><button class="btn" data-act="export-json">${t('set.exportJson')}</button><button class="btn ghost" data-act="export-csv">${t('set.exportCsv')}</button>
    <button class="btn ghost" data-act="import">${t('set.import')}</button></div>
    <input type="file" id="file" accept=".json,application/json" hidden></section>
  <section class="card"><h2>${t('set.install')}</h2><p class="small muted" style="margin:0">${t('set.install.txt')}</p></section>
  <section class="card"><button class="btn danger" data-act="reset">${t('set.danger')}</button><p class="small muted" style="margin:10px 0 0">Timeføring 1.0</p></section>`;
}

function renderModal() {
  const m = $('#modal');
  if (!ui.modal) { m.hidden = true; m.innerHTML = ''; document.body.classList.remove('lock'); return; }
  const ds = ui.modal, r = calc(ds, DB.days[ds], S());
  m.hidden = false; document.body.classList.add('lock');
  m.innerHTML = `<div class="scrim" data-act="closeModal"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${wdName(ds)} ${dLong(ds)}">
    <header><h2>${wdName(ds)} ${dLong(ds)}</h2><button data-act="closeModal" aria-label="${t('closeLbl')}">✕</button></header>
    ${r.hol ? `<p class="note" style="margin-bottom:12px">${esc(t(r.hol))}</p>` : ''}
    ${r.gross > 0 ? numsHTML(r) : ''}${editor(ds)}
    ${DB.days[ds] ? `<div class="row" style="margin-top:14px"><button class="btn danger" data-act="delday">${t('delday')}</button></div>` : ''}</div>`;
}

function render() {
  document.documentElement.lang = L();
  renderHeader(); renderTabs();
  $('#main').innerHTML = ui.view === 'today' ? viewToday() : ui.view === 'week' ? viewWeek() : ui.view === 'overview' ? viewOverview() : viewSettings();
  renderModal();
}

/* ================= EKSPORT / IMPORT ================= */
function csvText() {
  const line = a => a.map(x => { x = String(x); return /[;"\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }).join(';');
  const rows = [['Dato', 'Veke', 'Dag', 'Type', 'Inn', 'Ut', 'Lønsj', 'Overtid', 'ST (brutto)', 'Normaltid (netto)', 'Dobbel tid', 'Overtid (t)', 'Flex (t)', 'Notat']];
  for (const ds of Object.keys(DB.days).sort()) {
    const d = DB.days[ds], r = calc(ds, d, S());
    rows.push([ds, isoWeek(fromISO(ds)).week, WD.nn[r.dow - 1], t('type.' + r.type), d.in || '', d.out || '', d.lunch ? 'ja' : 'nei', d.ot ? 'ja' : '',
      r.gross ? fd(r.st) : '', r.gross ? fd(r.nt) : '', r.gross ? fd(r.dbl) : '', r.ot ? fd(r2(r.ot / 60)) : '', r.counted ? fd(r2(r.flex / 60)) : '', d.note || '']);
  }
  return '\ufeff' + rows.map(line).join('\r\n');
}
function importData(text) {
  let o; try { o = JSON.parse(text); } catch (e) { toast(t('imp.bad')); return; }
  if (!o || typeof o.days !== 'object' || Array.isArray(o.days)) { toast(t('imp.bad')); return; }
  const days = {};
  for (const ds in o.days) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(ds)) continue;
    const d = o.days[ds]; if (!d || typeof d !== 'object') continue;
    const c = {};
    c.type = TYPES.includes(d.type) ? d.type : 'work';
    if (d.in && parseTime(d.in)) c.in = parseTime(d.in);
    if (d.out && parseTime(d.out)) c.out = parseTime(d.out);
    if (d.lunch !== undefined) c.lunch = !!d.lunch;
    if (d.lunchStart && parseTime(d.lunchStart)) c.lunchStart = parseTime(d.lunchStart);
    if (d.ot) c.ot = true;
    if (d.note) c.note = String(d.note).slice(0, 200);
    days[ds] = c;
  }
  const n = Object.keys(days).length;
  if (!n) { toast(t('imp.bad')); return; }
  if (!confirm(t('imp.confirm', { n }))) return;
  Object.assign(DB.days, days);
  if (o.settings && o.kind === 'backup' && confirm(t('imp.settings'))) DB.settings = normalizeDB({ settings: o.settings }).settings;
  save(); render(); toast(t('imp.ok', { n }));
}

/* ================= HENDINGAR ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, ed = el.closest('[data-date]'), ds = ed ? ed.dataset.date : null;
  switch (act) {
    case 'tab': ui.view = el.dataset.v; ui.modal = null; render(); window.scrollTo(0, 0); break;
    case 'ring': {
      const today = todayISO(), d = DB.days[today];
      if (d && d.in && !d.out && isWork(d.type)) {
        const out = nowHM();
        if (toMin(out) <= toMin(d.in)) { toast(t('bad')); break; }
        setDay(today, { out });
      } else setDay(today, { type: d && d.type && isWork(d.type) ? d.type : 'work', in: nowHM(), out: '' });
      break;
    }
    case 'reopen': setDay(todayISO(), { out: '' }); break;
    case 'now': setDay(ds, { [el.dataset.f]: nowHM() }); break;
    case 'type': setDay(ds, { type: el.dataset.v }); break;
    case 'edit': ui.modal = el.dataset.date; render(); break;
    case 'closeModal': ui.modal = null; render(); break;
    case 'delday': if (confirm(t('delconfirm'))) { delete DB.days[ui.modal]; ui.modal = null; save(); render(); } break;
    case 'wk': ui.week = iso(addDays(fromISO(ui.week), 7 * +el.dataset.n)); render(); break;
    case 'wk-today': ui.week = iso(mondayOf(new Date())); render(); break;
    case 'weekend': ui.weekend = !ui.weekend; render(); break;
    case 'copy': copyText(el.dataset.text); break;
    case 'copyweek': {
      const days = weekData(ui.week).days.filter((r, i) => i < 5 || DB.days[r.ds]);
      const row = (lab, f) => lab + '\t' + days.map(f).join('\t');
      copyText([t('weekLbl', { w: isoWeek(fromISO(ui.week)).week }), row('', r => wdShort(r.ds)),
        row('ST', r => r.gross ? fd(r.st) : ''), row(t('net'), r => r.gross ? fd(r.nt) : ''), row(t('dbl'), r => r.gross ? fd(r.dbl) : '')].join('\n'));
      break;
    }
    case 'mo': { let [y, m] = ui.month.split('-').map(Number); m += +el.dataset.n; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } ui.month = y + '-' + pad2(m); render(); break; }
    case 'vac': ui.vacYear += +el.dataset.n; render(); break;
    case 'export-json': saveFile('timeforing-sikkerheitskopi-' + todayISO() + '.json', JSON.stringify({ app: 'timeforing', kind: 'backup', version: 1, settings: DB.settings, days: DB.days }, null, 1), 'application/json'); break;
    case 'export-csv': saveFile('timeforing-' + todayISO() + '.csv', csvText(), 'text/csv'); break;
    case 'import': $('#file').click(); break;
    case 'reset': if (confirm(t('set.danger.confirm'))) { DB = defaults(); save(); render(); toast(t('reset.done')); } break;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'file') { const f = el.files[0]; if (f) f.text().then(importData); el.value = ''; return; }
  if (el.dataset.act === 'weekfill') {
    const type = el.value; if (!type) return;
    const data = weekData(ui.week); let n = 0;
    for (const r of data.days) if (r.norm > 0 && !DB.days[r.ds]) { DB.days[r.ds] = { type }; n++; }
    save(); render(); toast(n ? t('filled', { n }) : t('nothingFilled')); return;
  }
  const f = el.dataset.f, sKey = el.dataset.s;
  if (f) {
    const ed = el.closest('[data-date]'), ds = ed.dataset.date;
    if (f === 'in' || f === 'out' || f === 'lunchStart') {
      const v = parseTime(el.value);
      if (v === null) { toast('Skriv t.d. 815 eller 08:15'); render(); return; }
      setDay(ds, { [f]: v });
    } else if (f === 'lunch' || f === 'ot') setDay(ds, { [f]: el.checked });
    else if (f === 'note') setDay(ds, { note: el.value.trim() });
  } else if (sKey) {
    const s = DB.settings;
    if (sKey === 'name') s.name = el.value.trim();
    else if (sKey === 'lang') s.lang = el.value;
    else if (sKey === 'showST' || sKey === 'lunchDefault') s[sKey] = el.checked;
    else if (sKey === 'lunchStart') { const v = parseTime(el.value); if (v) s.lunchStart = v; else toast('Skriv t.d. 11:00'); }
    else if (sKey.startsWith('vac')) {
      const x = num(el.value), v = vacOf(ui.vacYear);
      if (x !== null) { const k = { vacRett: 'rett', vacOver: 'over', vacOut: 'out' }[sKey]; v[k] = x; s.vac[ui.vacYear] = v; }
    } else { const x = num(el.value); if (x !== null && (sKey !== 'norm' || x > 0) && (sKey !== 'lunch' || x >= 0)) s[sKey] = x; }
    save(); render();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.modal) { ui.modal = null; render(); }
  if (e.key === 'Enter' && e.target.matches('input[type=text]')) e.target.blur();
});
setInterval(() => { if (ui.view === 'today' && !ui.modal && !document.activeElement.matches('input,select,textarea')) render(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !document.activeElement.matches('input,select,textarea')) { ui.view === 'today' && (ui.week = iso(mondayOf(new Date()))); render(); } });

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
